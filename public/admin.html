<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송년회 관리자 - 간단 버전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/firebase-config.js?v=2"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">
                🎉 2025년 강둑 송년회
            </h1>
            <p class="text-blue-200 text-lg">관리자 페이지 (간단 버전)</p>
            <div class="mt-2">
                <a href="debug.html" class="text-blue-300 hover:text-white text-sm underline">
                    🔧 시스템 디버그
                </a>
            </div>
            
            <div class="mt-4 bg-blue-800 bg-opacity-50 rounded-lg p-4">
                <p class="text-white text-lg mb-2">
                    📅 2025년 12월 10일(수) 14:00 ~<br>
                    📍 사당역 10번 출구 제키당구클럽<br>
                    👥 7~8명 예정
                </p>
                <p class="text-white text-lg">
                    총 <span id="totalCount" class="font-bold text-yellow-300">0명</span> 중 
                    <span id="checkedInCount" class="font-bold text-green-300">0명</span> 체크인 완료
                </p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 참석자 추가 -->
            <div class="bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-blue-500">
                <h3 class="text-xl font-semibold text-white mb-4">참석자 추가</h3>
                <div class="space-y-4">
                    <input
                        type="text"
                        id="newName"
                        placeholder="이름"
                        class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 focus:border-blue-400 focus:outline-none"
                    />
                    <input
                        type="text"
                        id="newPhone"
                        placeholder="전화번호 (선택사항)"
                        class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 focus:border-blue-400 focus:outline-none"
                    />
                    <button
                        onclick="addAttendee()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        추가
                    </button>
                </div>
            </div>

            <!-- 간단한 관리 메뉴 -->
            <div class="bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-green-500">
                <h3 class="text-xl font-semibold text-white mb-4">관리</h3>
                <div class="space-y-3">
                    <button
                        onclick="copyToClipboard()"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        📋 클립보드 복사
                    </button>
                    <button
                        onclick="exportToCSV()"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        📁 CSV 다운로드
                    </button>
                    <button
                        onclick="exportForSharing()"
                        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        📤 공유용 내보내기
                    </button>
                    <button
                        onclick="refreshAllData()"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        🔄 데이터 새로고침
                    </button>
                    <button
                        onclick="showQuickStats()"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        📊 빠른 통계
                    </button>
                    <button
                        onclick="generateSampleData()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        🎭 샘플 데이터 생성
                    </button>
                    <button
                        onclick="confirmCompleteReset()"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
                    >
                        🗑️ 전체 삭제
                    </button>
                </div>
            </div>
        </div>

        <!-- 참석자 목록 -->
        <div class="mt-6 bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-purple-500">
            <h3 class="text-xl font-semibold text-white mb-4">참석자 목록</h3>
            <div id="attendeeList" class="space-y-2 max-h-96 overflow-y-auto">
                <div class="text-gray-400 text-center py-8">참석자가 없습니다.</div>
            </div>
        </div>
    </div>

    <script>
        let attendees = [];
        let firebaseUnsubscribe = null;

        // Firebase 상태 표시
        function updateFirebaseStatus(status, message) {
            console.log(`Firebase ${status}: ${message}`);
            
            // 헤더에 상태 표시 추가
            const header = document.querySelector('header');
            let statusElement = document.getElementById('firebase-status');
            
            if (!statusElement) {
                statusElement = document.createElement('div');
                statusElement.id = 'firebase-status';
                statusElement.className = 'mt-2 text-sm';
                header.appendChild(statusElement);
            }
            
            const statusColors = {
                'success': 'text-green-400',
                'error': 'text-red-400', 
                'warning': 'text-yellow-400',
                'info': 'text-blue-400'
            };
            
            statusElement.className = `mt-2 text-sm ${statusColors[status] || 'text-gray-400'}`;
            statusElement.textContent = `🔥 ${message}`;
        }

        // 참석자 추가
        async function addAttendee() {
            const nameInput = document.getElementById('newName');
            const phoneInput = document.getElementById('newPhone');
            
            const name = nameInput.value.trim();
            if (!name) {
                alert('이름을 입력하세요.');
                nameInput.focus();
                return;
            }

            const phone = phoneInput.value.trim();
            const attendee = {
                id: Date.now().toString(),
                name,
                phone,
                checkedIn: false,
                timestamp: new Date().toISOString()
            };

            try {
                // Firebase에 추가
                if (window.firebaseManager) {
                    await window.firebaseManager.addAttendee(attendee);
                    console.log('Firebase에 추가됨');
                }

                // 입력 필드 초기화
                nameInput.value = '';
                phoneInput.value = '';
                nameInput.focus();
            } catch (error) {
                console.error('추가 실패:', error);
                alert('참석자 추가에 실패했습니다.');
            }
        }

        // 참석자 삭제
        async function deleteAttendee(id) {
            if (!confirm('정말로 삭제하시겠습니까?')) return;

            try {
                if (window.firebaseManager) {
                    await window.firebaseManager.deleteAttendee(id);
                    console.log('삭제됨');
                }
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('삭제에 실패했습니다.');
            }
        }

        // 체크인 토글
        async function toggleCheckin(id) {
            try {
                const attendee = attendees.find(a => a.id === id);
                if (!attendee) return;

                const newStatus = !attendee.checkedIn;
                const updateData = {
                    checkedIn: newStatus,
                    checkedInAt: newStatus ? new Date().toISOString() : ''
                };

                if (window.firebaseManager) {
                    await window.firebaseManager.updateAttendee(id, updateData);
                    console.log('체크인 상태 변경됨');
                }
            } catch (error) {
                console.error('체크인 실패:', error);
                alert('체크인 변경에 실패했습니다.');
            }
        }

        // UI 업데이트
        function updateUI() {
            document.getElementById('totalCount').textContent = attendees.length;
            document.getElementById('checkedInCount').textContent = 
                attendees.filter(a => a.checkedIn).length;

            const listElement = document.getElementById('attendeeList');
            if (attendees.length === 0) {
                listElement.innerHTML = '<div class="text-gray-400 text-center py-8">참석자가 없습니다.</div>';
                return;
            }

            // 이름순 정렬
            const sortedAttendees = [...attendees].sort((a, b) => a.name.localeCompare(b.name));

            listElement.innerHTML = sortedAttendees.map(attendee => `
                <div class="bg-white bg-opacity-5 rounded-lg p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex-grow">
                        <div class="flex items-center gap-3">
                            <span class="text-white font-semibold">${attendee.name}</span>
                            ${attendee.checkedIn ? 
                                '<span class="bg-green-600 text-white px-2 py-1 rounded-full text-xs">✓ 체크인</span>' :
                                '<span class="bg-gray-600 text-white px-2 py-1 rounded-full text-xs">대기</span>'
                            }
                        </div>
                        ${attendee.phone ? `<div class="text-gray-300 text-sm mt-1">${attendee.phone}</div>` : ''}
                    </div>
                    <div class="flex gap-2">
                        <button 
                            onclick="toggleCheckin('${attendee.id}')" 
                            class="px-3 py-1 rounded text-sm font-medium transition-colors ${
                                attendee.checkedIn 
                                    ? 'bg-green-600 hover:bg-green-700 text-white' 
                                    : 'bg-blue-600 hover:bg-blue-700 text-white'
                            }">
                            ${attendee.checkedIn ? '체크아웃' : '체크인'}
                        </button>
                        <button 
                            onclick="deleteAttendee('${attendee.id}')" 
                            class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-medium transition-colors">
                            삭제
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 클립보드 복사
        function copyToClipboard() {
            if (attendees.length === 0) {
                alert('복사할 참석자가 없습니다.');
                return;
            }

            const text = attendees
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(a => `${a.name}${a.phone ? ` (${a.phone})` : ''} ${a.checkedIn ? '✓' : '○'}`)
                .join('\n');

            navigator.clipboard.writeText(text).then(() => {
                alert('클립보드에 복사되었습니다!');
            });
        }

        // CSV 내보내기
        function exportToCSV() {
            if (attendees.length === 0) {
                alert('내보낼 데이터가 없습니다.');
                return;
            }

            const header = '이름,전화번호,체크인상태,체크인시간\n';
            const rows = attendees
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(a => `"${a.name}","${a.phone || ''}","${a.checkedIn ? '완료' : '대기'}","${a.checkedInAt || ''}"`)
                .join('\n');

            const csv = header + rows;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `송년회_참석자명단_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // 샘플 데이터 생성
        async function generateSampleData() {
            const count = parseInt(prompt('생성할 샘플 데이터 개수를 입력하세요:', '5'));
            if (isNaN(count) || count <= 0) return;

            const sampleNames = ['김철수', '이영희', '박민수', '정수연', '최동우', '한미래', '송지원', '강태현', '오하늘', '임바다'];
            
            try {
                for (let i = 0; i < count; i++) {
                    const name = sampleNames[i % sampleNames.length] + (i >= sampleNames.length ? ` ${Math.floor(i / sampleNames.length) + 1}` : '');
                    const phone = `010-${String(Math.floor(Math.random() * 9000) + 1000)}-${String(Math.floor(Math.random() * 9000) + 1000)}`;
                    
                    const attendee = {
                        id: Date.now().toString() + i,
                        name,
                        phone,
                        checkedIn: Math.random() > 0.7, // 30% 체크인
                        timestamp: new Date().toISOString()
                    };

                    if (attendee.checkedIn) {
                        attendee.checkedInAt = new Date().toISOString();
                    }

                    if (window.firebaseManager) {
                        await window.firebaseManager.addAttendee(attendee);
                    }
                }
                alert(`${count}개의 샘플 데이터가 생성되었습니다.`);
            } catch (error) {
                console.error('샘플 생성 실패:', error);
                alert('샘플 데이터 생성에 실패했습니다.');
            }
        }

        // 전체 삭제
        async function confirmCompleteReset() {
            if (attendees.length === 0) {
                alert('삭제할 데이터가 없습니다.');
                return;
            }

            // 1단계: 기본 확인
            if (!confirm(`⚠️ 전체 삭제

현재 ${attendees.length}명의 참석자 데이터가 모두 삭제됩니다.

계속하시겠습니까?`)) {
                return;
            }
            
            // 2단계: 최종 확인 (안전 코드)
            const safetyCode = Math.floor(1000 + Math.random() * 9000);
            const userInput = prompt(`🔐 최종 확인

안전을 위해 다음 숫자를 입력하세요:
${safetyCode}`);
            
            if (userInput !== String(safetyCode)) {
                alert('❌ 코드가 일치하지 않습니다. 삭제가 취소되었습니다.');
                return;
            }

            // 3단계: 완전 삭제 실행
            try {
                // Firebase 데이터 삭제
                if (window.firebaseManager) {
                    await window.firebaseManager.clearAllAttendees();
                }
                
                // 로컬 데이터 삭제
                attendees = [];
                localStorage.removeItem('attendees');
                
                // UI 업데이트
                updateUI();
                
                alert('✅ 모든 데이터가 완전히 삭제되었습니다.');
            } catch (error) {
                console.error('삭제 중 오류:', error);
                alert('❌ 삭제 중 오류가 발생했습니다.');
            }
        }

        // Firebase 데이터 로드
        async function loadAttendees() {
            console.log('🔥 Firebase 데이터 로드 시도...');
            
            // 로딩 표시
            const listElement = document.getElementById('attendeeList');
            listElement.innerHTML = '<div class="text-blue-400 text-center py-8">🔄 Firebase 연결 중...</div>';
            
            // Firebase Manager가 준비될 때까지 최대 15초 대기
            let attempts = 0;
            const maxAttempts = 30; // 0.5초 * 30 = 15초
            
            const waitForFirebase = () => {
                return new Promise((resolve, reject) => {
                    const checkFirebase = () => {
                        attempts++;
                        console.log(`🔍 Firebase Manager 확인 중... (${attempts}/${maxAttempts})`);
                        
                        if (window.firebaseManager) {
                            console.log('✅ Firebase Manager 준비됨');
                            console.log('🔥 Manager 객체:', window.firebaseManager);
                            resolve();
                        } else if (attempts >= maxAttempts) {
                            console.error('❌ Firebase Manager 로드 시간 초과');
                            reject(new Error('Firebase Manager 로드 실패'));
                        } else {
                            setTimeout(checkFirebase, 500);
                        }
                    };
                    checkFirebase();
                });
            };

            try {
                // 1단계: Firebase Manager 대기
                await waitForFirebase();
                updateFirebaseStatus('info', 'Firebase Manager 로드됨');

                // 2단계: Firebase 연결 테스트
                console.log('🧪 Firebase 연결 테스트 중...');
                listElement.innerHTML = '<div class="text-yellow-400 text-center py-8">🧪 Firebase 연결 테스트 중...</div>';
                
                const testResult = await window.firebaseManager.testConnection();
                if (!testResult) {
                    throw new Error('Firebase 연결 테스트 실패');
                }
                updateFirebaseStatus('success', 'Firebase 연결 테스트 성공');

                // 3단계: 직접 데이터 로드 시도
                console.log('📊 직접 데이터 로드 시도...');
                listElement.innerHTML = '<div class="text-blue-400 text-center py-8">📊 데이터 로드 중...</div>';
                
                const directData = await window.firebaseManager.getAttendees();
                console.log('📋 직접 로드된 데이터:', directData.length, '개');
                
                if (directData && directData.length > 0) {
                    attendees = directData;
                    updateUI();
                    updateFirebaseStatus('success', `${directData.length}명 데이터 로드됨`);
                }

                // 4단계: 실시간 리스너 설정
                console.log('🔗 실시간 리스너 설정 중...');
                firebaseUnsubscribe = window.firebaseManager.listenToAttendees((data) => {
                    console.log('📊 실시간 데이터 업데이트:', data.length, '명');
                    attendees = data;
                    updateUI();
                    updateFirebaseStatus('success', `실시간 동기화 (${data.length}명)`);
                });

                console.log('🎉 Firebase 연결 및 리스너 설정 완료');
                
                // 성공 표시
                if (attendees.length === 0) {
                    listElement.innerHTML = `
                        <div class="text-center py-8">
                            <div class="text-green-400 mb-4">✅ Firebase 연결 성공!</div>
                            <div class="text-yellow-400">📝 참석자가 없습니다.</div>
                            <div class="text-gray-400 text-sm mt-2">샘플 데이터를 생성해보세요.</div>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Firebase 로드 실패:', error);
                console.error('🔍 상세 오류:', {
                    message: error.message,
                    stack: error.stack,
                    firebaseManager: !!window.firebaseManager
                });
                
                // 오류 메시지 표시
                let errorMessage = 'Firebase 연결에 실패했습니다.';
                let troubleshooting = [];
                
                if (error.message.includes('permission-denied')) {
                    errorMessage = 'Firebase 보안 규칙 오류: 읽기 권한이 없습니다.';
                    troubleshooting.push('Firebase 콘솔 → Firestore → 규칙에서 allow read, write: if true; 설정');
                } else if (error.message.includes('unavailable')) {
                    errorMessage = '네트워크 오류: 인터넷 연결을 확인해주세요.';
                    troubleshooting.push('인터넷 연결 상태 확인');
                } else if (error.message.includes('unauthenticated')) {
                    errorMessage = '인증 오류: Firebase 설정을 확인해주세요.';
                    troubleshooting.push('Firebase 프로젝트 ID 확인');
                }
                
                updateFirebaseStatus('error', errorMessage);
                
                listElement.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-red-400 mb-4">❌ ${errorMessage}</div>
                        <div class="text-sm text-gray-400 space-y-1">
                            ${troubleshooting.map(tip => `<div>💡 ${tip}</div>`).join('')}
                            <div class="mt-4">
                                <button onclick="loadAttendees()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">
                                    🔄 다시 시도
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 엔터키 이벤트
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('newName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const phoneInput = document.getElementById('newPhone');
                    if (phoneInput.value.trim()) {
                        addAttendee();
                    } else {
                        phoneInput.focus();
                    }
                }
            });

            document.getElementById('newPhone').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addAttendee();
                }
            });
        });

        // 데이터 새로고침
        async function refreshAllData() {
            try {
                console.log('🔄 데이터 새로고침 시작...');
                
                if (window.firebaseManager) {
                    // Firebase에서 직접 데이터 가져오기
                    const freshData = await window.firebaseManager.getAttendees();
                    attendees = freshData.map(a => ({
                        id: a.id,
                        name: a.name || '',
                        phone: a.phone || '',
                        checkedIn: a.checkedIn || false,
                        checkedInAt: a.checkedInAt || '',
                        timestamp: a.timestamp
                    }));
                    
                    updateUI();
                    
                    // 성공 알림
                    const notification = document.createElement('div');
                    notification.className = 'fixed top-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50';
                    notification.textContent = `✅ ${attendees.length}명의 데이터가 새로고침되었습니다.`;
                    document.body.appendChild(notification);
                    
                    setTimeout(() => {
                        notification.style.opacity = '0';
                        setTimeout(() => notification.remove(), 300);
                    }, 2000);
                } else {
                    alert('❌ Firebase 연결이 없습니다.');
                }
            } catch (error) {
                console.error('새로고침 실패:', error);
                alert('❌ 데이터 새로고침에 실패했습니다.');
            }
        }

        // 빠른 통계 보기
        function showQuickStats() {
            if (attendees.length === 0) {
                alert('통계를 보여줄 데이터가 없습니다.');
                return;
            }

            const checkedInAttendees = attendees.filter(a => a.checkedIn);
            const waitingAttendees = attendees.filter(a => !a.checkedIn);
            
            // 시간대별 체크인 분석 (체크인된 사람들만)
            const checkinTimes = checkedInAttendees
                .filter(a => a.checkedInAt)
                .map(a => new Date(a.checkedInAt).getHours())
                .sort((a, b) => a - b);
            
            let timeAnalysis = '';
            if (checkinTimes.length > 0) {
                const earliest = Math.min(...checkinTimes);
                const latest = Math.max(...checkinTimes);
                timeAnalysis = `
⏰ 체크인 시간대:
• 가장 빠른 체크인: ${earliest}시
• 가장 늦은 체크인: ${latest}시`;
            }

            const statsMessage = `📊 빠른 통계

👥 전체 참석자: ${attendees.length}명
✅ 체크인 완료: ${checkedInAttendees.length}명
⏳ 대기 중: ${waitingAttendees.length}명

📊 체크인률: ${attendees.length > 0 ? Math.round((checkedInAttendees.length / attendees.length) * 100) : 0}%${timeAnalysis}`;
            
            alert(statsMessage);
        }

        // 페이지 로드 시 실행
        window.addEventListener('load', function() {
            console.log('🚀 관리자 페이지 로드됨');
            console.log('🌐 현재 위치:', window.location.href);
            console.log('🔧 User Agent:', navigator.userAgent);
            
            // Firebase 준비 이벤트 리스너
            window.addEventListener('firebaseReady', function(event) {
                console.log('🎯 Firebase Ready 이벤트 수신됨');
                setTimeout(() => {
                    loadAttendees();
                }, 500);
            });
            
            // Fallback: 일정 시간 후에도 실행
            setTimeout(() => {
                console.log('⏰ Fallback 실행 - Firebase Manager 상태:', !!window.firebaseManager);
                if (window.firebaseManager && attendees.length === 0) {
                    loadAttendees();
                } else if (!window.firebaseManager) {
                    console.error('❌ Firebase Manager가 로드되지 않았습니다');
                    document.getElementById('attendeeList').innerHTML = `
                        <div class="text-red-400 text-center py-8">
                            <div class="mb-4">❌ Firebase Manager 로드 실패</div>
                            <div class="text-sm text-gray-400">
                                <div>🔄 페이지를 새로고침해보세요</div>
                                <div class="mt-2">
                                    <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">
                                        🔄 새로고침
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }, 3000); // 3초 후 실행
        });
    </script>
</body>
</html>
