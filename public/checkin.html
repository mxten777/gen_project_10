<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="version" content="v2.1.0">
  <title>체크인 - 2025년 강둑 송년회</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK & Config -->
  <script type="module">
    // Firebase 설정 파일 로드
    import('./js/firebase-config.js')
      .then(() => {
        console.log('✅ Firebase 설정 로드 완료');
      })
      .catch(error => {
        console.error('❌ Firebase 설정 로드 실패:', error);
      });
  </script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    
    /* 연결 상태 표시 */
    .connection-status {
      position: fixed;
      top: 70px;
      right: 20px;
      z-index: 40;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .status-online {
      background: #10b981;
      color: white;
    }
    
    .status-offline {
      background: #f59e0b;
      color: white;
    }
    
    .status-syncing {
      background: #3b82f6;
      color: white;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-700 to-slate-900 min-h-screen">
  
  <!-- 연결 상태 표시 -->
  <div id="connectionStatus" class="connection-status status-syncing">
    <span id="statusText">🔄 연결 중...</span>
  </div>
  
  <!-- 네비게이션 바 -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-black bg-opacity-80 backdrop-blur-md border-b border-slate-600 shadow-lg">
    <div class="max-w-7xl mx-auto px-2 sm:px-4">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-2 sm:space-x-4">
          <img src="images/baikal_logo.png" alt="바이칼 로고" class="w-8 h-8 sm:w-12 sm:h-12 rounded-full object-contain">
          <h1 class="text-white font-bold text-sm sm:text-lg drop-shadow-sm">2025년 강둑 송년회</h1>
        </div>
        
        <!-- 간단한 홈 버튼 -->
        <div class="flex">
          <a href="/" class="px-4 py-2 rounded-lg text-sm font-semibold bg-gray-600 hover:bg-gray-700 text-white shadow-sm transition-colors">
            🏠 홈
          </a>
        </div>
      </div>
    </div>

  </nav>

  <!-- 메인 컨텐츠 -->
  <div class="pt-16 flex items-center justify-center px-2 sm:px-4 min-h-screen">
    <div id="checkinForm" class="bg-white bg-opacity-10 backdrop-blur-sm rounded-2xl p-4 sm:p-8 border border-blue-500 max-w-md w-full mx-4">
      <div class="text-center mb-6 sm:mb-8">
        <div class="text-3xl sm:text-4xl mb-3 sm:mb-4">📝</div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">체크인</h1>
        <h2 class="text-lg sm:text-xl text-blue-300 font-semibold">2025년 강둑 송년회</h2>
      </div>

      <div class="mb-6">
        <div class="bg-blue-800 bg-opacity-30 rounded-lg p-4 text-center">
          <p class="text-blue-200 text-sm mb-1">📅 2025년 12월 10일(수) 14:00 ~</p>
          <p class="text-blue-200 text-sm">📍 사당역 10번 출구 제키당구클럽</p>
        </div>
      </div>

      <form class="space-y-4" onsubmit="handleCheckIn(event)">
        <div>
          <label class="block text-white text-sm font-semibold mb-2">
            이름 <span class="text-red-400">*</span>
          </label>
          <input
            type="text"
            id="nameInput"
            placeholder="이름을 입력해주세요"
            class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 focus:border-blue-400 focus:outline-none transition-colors"
            required
          />
        </div>

        <div>
          <label class="block text-white text-sm font-semibold mb-2">
            연락처 (선택사항)
          </label>
          <input
            type="text"
            id="phoneInput"
            placeholder="010-1234-5678"
            class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-600 focus:border-blue-400 focus:outline-none transition-colors"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold py-4 px-4 rounded-lg transition-all duration-200 transform hover:scale-105"
        >
          ✨ 체크인하기
        </button>
      </form>



      <div class="mt-6 text-center">
        <p class="text-slate-400 text-xs">
          ✨ "오래 보니 좋고, 앞으로 더 좋아질 우리"
        </p>
      </div>
    </div>

    <!-- 체크인 완료 화면 -->
    <div id="successScreen" class="bg-white bg-opacity-10 backdrop-blur-sm rounded-2xl p-8 border border-green-400 max-w-md w-full text-center hidden">
      <div class="text-6xl mb-6">✅</div>
      <h1 class="text-3xl font-bold text-white mb-4">체크인 완료!</h1>
      <div class="bg-green-800 bg-opacity-50 rounded-lg p-4 mb-6">
        <p id="successName" class="text-green-200 text-lg font-semibold"></p>
        <p id="successTime" class="text-green-300 text-sm mt-1"></p>
        <p id="successPhone" class="text-green-300 text-sm"></p>
      </div>
      <div class="mb-6">
        <h3 class="text-white font-semibold mb-2">🎉 2025년 강둑 송년회</h3>
        <p class="text-slate-300 text-sm">2025년 12월 10일(수) 14:00 ~</p>
        <p class="text-slate-300 text-sm">사당역 10번 출구 제키당구클럽</p>
      </div>
      <button
        onclick="resetForm()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
      >
        다른 참석자 체크인
      </button>
    </div>
  </div>

  <script>
    async function handleCheckIn(event) {
      event.preventDefault();
      
      const name = document.getElementById('nameInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();
      
      // 입력값 검증
      if (!name) {
        showErrorMessage('이름을 입력해주세요!');
        document.getElementById('nameInput').focus();
        return;
      }

      // Firebase 연동된 체크인 처리
      try {
        updateConnectionStatus('syncing', '🔄 체크인 중...');
        
        // Firebase Manager를 사용해 중복 체크인 확인
        if (window.firebaseManager) {
          const isDuplicate = await window.firebaseManager.checkDuplicate(name, phone);
          
          if (isDuplicate) {
            if (!confirm(`"${name}"님은 이미 체크인되어 있습니다.\n\n그래도 계속하시겠습니까?`)) {
              updateConnectionStatus('online', '✅ 연결됨');
              return;
            }
          }

          // Firebase에 체크인 데이터 저장
          const attendeeData = {
            name: name,
            phone: phone || '',
            checkedIn: true,
            checkedInAt: new Date().toLocaleString('ko-KR'),
            timestamp: new Date()
          };
          
          console.log('📝 체크인 데이터 저장 시도:', attendeeData);
          const result = await window.firebaseManager.addAttendee(attendeeData);
          console.log('✅ Firebase 저장 성공:', result);
          updateConnectionStatus('online', '✅ 저장완료');
          
          // 추가 확인을 위해 잠시 후 데이터 조회
          setTimeout(async () => {
            try {
              const attendees = await window.firebaseManager.getAttendees();
              const saved = attendees.find(a => a.name === name);
              if (saved) {
                console.log('✅ 저장 확인됨:', saved);
              } else {
                console.error('❌ 저장되지 않음 - 다시 시도 필요');
                alert('⚠️ 저장 확인 실패. 관리자에게 문의하세요.');
              }
            } catch (error) {
              console.error('저장 확인 중 오류:', error);
            }
          }, 1000);
          
        } else {
          // Firebase가 없을 경우 localStorage 사용 (백업)
          console.warn('Firebase Manager를 사용할 수 없습니다. localStorage를 사용합니다.');
          
          let attendees = JSON.parse(localStorage.getItem('attendees') || '[]');
          const duplicateCheck = attendees.find(a => a.name === name && a.checkedIn);
          
          if (duplicateCheck) {
            if (!confirm(`"${name}"님은 이미 체크인되어 있습니다.\n\n체크인 시간: ${duplicateCheck.checkedInAt}\n\n그래도 계속하시겠습니까?`)) {
              return;
            }
          }
          
          attendees.push({
            id: Date.now().toString(),
            name: name,
            phone: phone || '',
            checkedIn: true,
            checkedInAt: new Date().toLocaleString('ko-KR')
          });
          localStorage.setItem('attendees', JSON.stringify(attendees));
          localStorage.setItem('cacheVersion', Date.now().toString());
        }
        
        // 체크인 완료 화면으로 전환
        document.getElementById('checkinForm').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
        
        // 체크인 정보 표시
        document.getElementById('successName').textContent = name + '님';
        document.getElementById('successTime').textContent = '체크인 시간: ' + new Date().toLocaleString('ko-KR');
        
        if (phone) {
          document.getElementById('successPhone').textContent = '연락처: ' + phone;
          document.getElementById('successPhone').classList.remove('hidden');
        } else {
          document.getElementById('successPhone').classList.add('hidden');
        }
        
        console.log('✅ 체크인 완료:', name);
        
      } catch (error) {
        console.error('❌ 체크인 오류:', error);
        updateConnectionStatus('offline', '❌ 오류발생');
        showErrorMessage('체크인 중 오류가 발생했습니다. 다시 시도해주세요.');
      }
    }
    
    // 연결 상태 업데이트 함수
    function updateConnectionStatus(status, message) {
      const statusElement = document.getElementById('connectionStatus');
      const statusText = document.getElementById('statusText');
      
      if (statusElement && statusText) {
        statusElement.className = `connection-status status-${status}`;
        statusText.textContent = message;
      }
    }

    // Firebase 연결 확인 및 초기화
    document.addEventListener('DOMContentLoaded', async function() {
      // Firebase Manager 로드 대기
      let retryCount = 0;
      const maxRetries = 10;
      
      const waitForFirebase = () => {
        return new Promise((resolve, reject) => {
          const checkFirebase = () => {
            if (window.firebaseManager) {
              resolve(true);
            } else if (retryCount >= maxRetries) {
              reject(new Error('Firebase 로드 시간 초과'));
            } else {
              retryCount++;
              setTimeout(checkFirebase, 500);
            }
          };
          checkFirebase();
        });
      };

      try {
        await waitForFirebase();
        updateConnectionStatus('online', '✅ 연결됨');
        console.log('🔥 Firebase Manager 연결 성공');
      } catch (error) {
        console.error('Firebase 연결 오류:', error);
        updateConnectionStatus('offline', '❌ 오프라인모드');
      }
      
      // 네트워크 상태 모니터링
      window.addEventListener('online', () => {
        if (window.firebaseManager) {
          updateConnectionStatus('online', '✅ 연결됨');
        } else {
          updateConnectionStatus('offline', '⚠️ Firebase 없음');
        }
      });
      
      window.addEventListener('offline', () => {
        updateConnectionStatus('offline', '⚠️ 오프라인');
      });
        // 네비게이션 간소화 완료 - 홈 버튼만 유지
    });
    
    // 에러 메시지 표시 함수
    function showErrorMessage(message) {
      // 기존 에러 메시지 제거
      const existingError = document.querySelector('.error-message');
      if (existingError) {
        existingError.remove();
      }
      
      // 새 에러 메시지 생성
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-message fixed top-20 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 text-sm';
      errorDiv.textContent = message;
      
      document.body.appendChild(errorDiv);
      
      // 3초 후 자동 제거
      setTimeout(() => {
        if (document.body.contains(errorDiv)) {
          errorDiv.style.opacity = '0';
          setTimeout(() => {
            if (document.body.contains(errorDiv)) {
              document.body.removeChild(errorDiv);
            }
          }, 300);
        }
      }, 3000);
    }
    
    // 강력한 캐시 버전 체크
    function checkCacheVersion() {
      const currentVersion = localStorage.getItem('cacheVersion');
      const pageVersion = sessionStorage.getItem('pageVersion');
      const forceReload = localStorage.getItem('forceReload');
      
      // 강제 리로드 플래그가 있으면 즉시 리로드
      if (forceReload === 'true') {
        localStorage.removeItem('forceReload');
        const url = new URL(window.location.href);
        url.searchParams.set('_cache', Date.now());
        window.location.replace(url.toString());
        return;
      }
      
      if (currentVersion && currentVersion !== pageVersion) {
        sessionStorage.setItem('pageVersion', currentVersion);
        console.log('캐시 업데이트 감지 - 데이터 새로고침');
        location.reload(true);
      }
    }
    
    // 페이지 로드 시 초기화
    window.addEventListener('load', function() {
      if (!sessionStorage.getItem('pageVersion')) {
        sessionStorage.setItem('pageVersion', Date.now().toString());
      }
      setInterval(checkCacheVersion, 3000);
    });
    
    function resetForm() {
      document.getElementById('checkinForm').classList.remove('hidden');
      document.getElementById('successScreen').classList.add('hidden');
      document.getElementById('nameInput').value = '';
      document.getElementById('phoneInput').value = '';
    }
  </script>
</body>
</html>
