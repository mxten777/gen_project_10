<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 디버그 - 2025년 강둑 송년회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/firebase-config.js?v=2"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-indigo-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-white mb-4">
                🔧 시스템 디버그
            </h1>
            <p class="text-blue-200">Firebase 연결 상태 및 데이터 확인</p>
        </header>

        <!-- Firebase 상태 -->
        <div class="bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-blue-500 mb-6">
            <h2 class="text-xl font-semibold text-white mb-4">🔥 Firebase 상태</h2>
            <div id="firebaseStatus" class="text-gray-300">
                <p>🔄 연결 확인 중...</p>
            </div>
        </div>

        <!-- 데이터 상태 -->
        <div class="bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-green-500 mb-6">
            <h2 class="text-xl font-semibold text-white mb-4">📊 데이터 상태</h2>
            <div id="dataStatus" class="text-gray-300">
                <p>📥 데이터 로딩 중...</p>
            </div>
        </div>

        <!-- 참석자 목록 (간단 표시) -->
        <div class="bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-purple-500 mb-6">
            <h2 class="text-xl font-semibold text-white mb-4">👥 참석자 목록</h2>
            <div id="attendeeData" class="text-gray-300">
                <p>👤 참석자 데이터 로딩 중...</p>
            </div>
        </div>

        <!-- 액션 버튼들 -->
        <div class="bg-white bg-opacity-10 backdrop-blur-sm rounded-xl p-6 border border-yellow-500">
            <h2 class="text-xl font-semibold text-white mb-4">🛠️ 디버그 도구</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg font-semibold transition-colors">
                    🔄 데이터 새로고침
                </button>
                <button onclick="testFirebase()" class="bg-green-600 hover:bg-green-700 text-white py-3 px-4 rounded-lg font-semibold transition-colors">
                    🧪 Firebase 테스트
                </button>
                <button onclick="showLogs()" class="bg-purple-600 hover:bg-purple-700 text-white py-3 px-4 rounded-lg font-semibold transition-colors">
                    📋 로그 보기
                </button>
                <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white py-3 px-4 rounded-lg font-semibold transition-colors text-center">
                    🏠 메인으로
                </a>
            </div>
        </div>
    </div>

    <script>
        let attendees = [];
        
        // Firebase 연결 상태 확인
        function checkFirebaseStatus() {
            const statusElement = document.getElementById('firebaseStatus');
            
            if (window.firebaseManager) {
                statusElement.innerHTML = `
                    <div class="space-y-2">
                        <p class="text-green-400">✅ Firebase Manager 로드됨</p>
                        <p class="text-blue-400">🔗 데이터베이스 연결 활성</p>
                        <p class="text-yellow-400">⏰ 실시간 리스너 대기 중</p>
                    </div>
                `;
                loadData();
            } else {
                statusElement.innerHTML = `
                    <div class="space-y-2">
                        <p class="text-red-400">❌ Firebase Manager 로드 실패</p>
                        <p class="text-gray-400">🔧 설정 파일을 확인해주세요</p>
                    </div>
                `;
            }
        }

        // 데이터 로드
        async function loadData() {
            try {
                const data = await window.firebaseManager.getAttendees();
                attendees = data;
                updateDataStatus();
                displayAttendees();
            } catch (error) {
                document.getElementById('dataStatus').innerHTML = `
                    <p class="text-red-400">❌ 데이터 로드 실패: ${error.message}</p>
                `;
            }
        }

        // 데이터 상태 업데이트
        function updateDataStatus() {
            const checkedIn = attendees.filter(a => a.checkedIn).length;
            document.getElementById('dataStatus').innerHTML = `
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>📊 전체 참석자: <span class="text-blue-300 font-bold">${attendees.length}명</span></div>
                    <div>✅ 체크인 완료: <span class="text-green-300 font-bold">${checkedIn}명</span></div>
                    <div>⏳ 대기 중: <span class="text-yellow-300 font-bold">${attendees.length - checkedIn}명</span></div>
                    <div>📈 체크인율: <span class="text-purple-300 font-bold">${attendees.length > 0 ? Math.round((checkedIn/attendees.length)*100) : 0}%</span></div>
                </div>
            `;
        }

        // 참석자 목록 표시
        function displayAttendees() {
            const element = document.getElementById('attendeeData');
            
            if (attendees.length === 0) {
                element.innerHTML = '<p class="text-gray-400">📝 등록된 참석자가 없습니다.</p>';
                return;
            }

            const list = attendees.slice(0, 10).map(a => `
                <div class="flex justify-between items-center py-2 border-b border-gray-600">
                    <div>
                        <span class="text-white font-medium">${a.name}</span>
                        ${a.phone ? `<span class="text-gray-400 text-sm ml-2">(${a.phone})</span>` : ''}
                    </div>
                    <div>
                        ${a.checkedIn ? 
                            '<span class="bg-green-600 text-white px-2 py-1 rounded text-xs">✓ 체크인</span>' : 
                            '<span class="bg-gray-600 text-white px-2 py-1 rounded text-xs">대기</span>'
                        }
                    </div>
                </div>
            `).join('');

            element.innerHTML = `
                <div class="space-y-1">
                    ${list}
                    ${attendees.length > 10 ? `<p class="text-gray-400 text-sm mt-4">... 외 ${attendees.length - 10}명 더</p>` : ''}
                </div>
            `;
        }

        // 새로고침
        function refreshData() {
            document.getElementById('dataStatus').innerHTML = '<p class="text-blue-400">🔄 새로고침 중...</p>';
            document.getElementById('attendeeData').innerHTML = '<p class="text-blue-400">👥 참석자 데이터 새로고침 중...</p>';
            
            setTimeout(() => {
                checkFirebaseStatus();
            }, 500);
        }

        // Firebase 테스트
        async function testFirebase() {
            if (!window.firebaseManager) {
                alert('❌ Firebase Manager가 로드되지 않았습니다.');
                return;
            }

            try {
                const testData = {
                    id: 'test-' + Date.now(),
                    name: '테스트 사용자',
                    phone: '010-1234-5678',
                    checkedIn: false,
                    timestamp: new Date().toISOString()
                };

                await window.firebaseManager.addAttendee(testData);
                alert('✅ Firebase 테스트 성공! 테스트 사용자가 추가되었습니다.');
                refreshData();
            } catch (error) {
                alert('❌ Firebase 테스트 실패: ' + error.message);
            }
        }

        // 로그 보기
        function showLogs() {
            console.log('=== 디버그 정보 ===');
            console.log('Firebase Manager:', window.firebaseManager);
            console.log('참석자 데이터:', attendees);
            console.log('현재 시간:', new Date().toISOString());
            alert('🔍 브라우저 개발자도구 콘솔을 확인하세요.\n\nF12 → Console 탭에서 상세 로그를 볼 수 있습니다.');
        }

        // 페이지 로드 시 실행
        window.addEventListener('load', function() {
            console.log('🔧 디버그 페이지 로드됨');
            
            // Firebase 로드 대기
            setTimeout(checkFirebaseStatus, 1000);
            
            // 주기적 상태 체크
            setInterval(checkFirebaseStatus, 10000);
        });
    </script>
</body>
</html>
